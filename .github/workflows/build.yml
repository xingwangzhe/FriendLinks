name: Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - "**/*.gitignore"
      - .editorconfig
      - docs/**
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore verified build artifacts
        uses: actions/cache@v6.1.0
        with:
          path: node_modules/.cache/friendlinks-build
          key: friendlinks-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            friendlinks-build-${{ runner.os }}-

      - name: Build
        run: bun run build
