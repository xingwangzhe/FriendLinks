name: Blacklist Dry Run

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: blacklist-dry-run-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan links without filtering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check blacklist matches without changing files
        run: bun run blacklist:dry-run
