# ── 数据源 ──────────────────────────────────────────────
# 易博集 (EboHub, eeenav.com/blogs) 是 E导航 旗下的独立博客聚合平台，
# 收录中文独立博客聚合平台与优质个人博客，按标签分类展示（无分页）。
# 数据来源：页面 https://eeenav.com/blogs 静态 HTML（onenav 主题），
#   每个 <article class="...post-<id>..."> 卡片含：
#   - title 属性 = 博客描述
#   - 卡片内 <a data-url="..."> 的 title 属性 = 博客名, data-url = 站点真实 URL
# 更新方式：抓取 /blogs 页面，按 post-<id> 提取卡片，清理 ?ref=eeenav.com 追踪参数后按 url 去重。
# 注意：列表同时包含聚合平台（博友圈/兰亭序等）与个人博客，均为易博集收录对象。
# ──────────────────────────────────────────────────────

