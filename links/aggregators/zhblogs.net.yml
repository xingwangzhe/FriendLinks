# ── 数据源（用于更新 friends）────────────────
# 站点: 集博栈（zhblogs.net，已更名 heyblog.net） https://www.zhblogs.net/
# 类型: API（JSON，分页）
# 地址: GET https://www.heyblog.net/api/site-directory?page=<N>&pageSize=48
#   - pageSize 上限 48（传更大值会被钳制为 48）；响应结构 {ok, data:{items,pagination,query}}。
#   - 默认排序受 randomSeed 控制（前端会传每日变化的 site-directory:YYYY-MM-DD 种子），
#     但无论哪种种子，翻页总能取到全量集合，务必按 url 去重后再落盘。
#   - statusMode=normal 时共 2709 条 / 57 页；abnormal 1514 条未收录。
#   - 字段映射: name→name, url→url, sign→description, feedUrl→订阅源,
#     primaryTag/subTags→分类, articleCount/visitCount→统计。
# 更新方式: 循环请求 page=1..57（以 pagination.totalPages 为准），按归一化 url 去重后整体重写。
# 收录核验: GET /api/site-directory?q=<关键词> 可精确检索某站（如 q=姓王者 命中 xingwangzhe.fun）。
# 总览统计: GET /api/site-directory/meta 返回 totalSites/normalSites/abnormalSites 与标签列表。
# 抓取时间: 2026-08-19 | 条目: 2701（API 全量 2709，去重后 2701）
# ─────────────────────────────────────────

