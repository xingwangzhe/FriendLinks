# ── 数据源 ──────────────────────────────────────────────
# FindBlog (findblog.net) 是一个"发现有趣独立博客"的 RSS 订阅/阅读平台，
# 聚合了用户订阅的博客最新文章流，无公开的博客目录 API。
# 数据来源：文章流分页 https://www.findblog.net/?page=<N> （共 24 页，2304 篇文章），
#   从每篇文章卡片的作者信息中提取站点域名与名称，去重后得到 721 个源站。
# 更新方式：循环抓取 ?page=1..N 直到页内无文章（"已显示 0 / 2304 篇文章"），
#   解析 favicon.is/<domain> 与作者名，按域名去重即可。
# 注意：长站点名在页面中被截断（以 ... 结尾），此处已去除尾部 ...；
#   平台亦收录部分新闻源（如极客公园、Solidot），如需可自行过滤。
# ──────────────────────────────────────────────────────

