# ── 数据源说明 ─────────────────────────────────────────────
# 站点：博客录 (boke.lu) — WordPress + Zibll 模板的博客收录平台
# 数据获取方式（2026-08-18 实测）：
#   1. 分类页 /shl（生活类）与 /fshl（非生活类）为「查看全部」归档页，
#      每页直接输出友链卡片 <a target="_blank" href="URL" title="描述">，名称在 <dt> 中。
#      curl https://boke.lu/shl 与 https://boke.lu/fshl 即可拿到全部站点，无需登录。
#   2. 首页 / 侧栏的跳转链接为 https://boke.lu/?golink=<base64>&nonce=... 形式，
#      base64 解码 golink 参数即真实站点 URL（golink 仅作 302 中转，非数据源）。
#   3. 年份归档 /2023-1 ... /2026-2 为分年视图，内容与 /shl /fshl 重叠，
#      实测仅多出 2 个站点（www.aiwazi.com、www.wsyblog.cn），已并入。
# 更新方式：重新抓取 /shl 与 /fshl 两个分类页即可刷新全部 414 个站点。
# ────────────────────────────────────────────────────────────

