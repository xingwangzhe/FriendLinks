# 博客星球 (blogplanet.cn) 收录个人博客，按年份分类展示。
# 说明：本机 DNS 经代理解析为 fake-IP (198.18.0.x) 导致 HTTPS 直连失败，
#   但站点本身存活；真实 DNS 为 blogplanet.cn → uscname.iqy.im → 104.233.187.151，
#   需用 -H "Host: blogplanet.cn" 直连 IP 访问。
# 数据来源：首页 HTML 内嵌 JS 变量 tool_list（完整分类 JSON，无分页）：
#   var tool_list = [ { title: "2025年博客", items: [...] }, ... ]
#   - 2025年博客 266 条 + 2026年博客 89 条，共 355 条。
#   - 字段：title=站点名, url=站点URL, icon=图标, category_id=年份分类。
# 更新方式：直连 IP 抓取首页 HTML，正则提取 var tool_list 后 JSON.parse，
#   按 url 去重填充。
# ──────────────────────────────────────────────────────

