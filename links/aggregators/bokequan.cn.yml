# ── 数据源说明 ─────────────────────────────────────────────
# 站点：博客圈 (bokequan.cn) — WordPress + onenav 主题的博客收录站
# 数据获取方式（2026-08-18 实测）：
#   1. 博客目录页 https://bokequan.cn/boke 与「更多」页 /favorites/allblog
#      为服务端渲染，友链卡片 <article class="posts-item"> 的
#      <a data-url="真实URL" title="站名"> + <b>站名</b> + 描述 即完整数据。
#   2. /favorites/allblog 每页 15 条，共 124 篇博客（9 页，page/1..9）。
#      页面底部「共 N 篇博客」可确认总数。
#   3. 另有 REST API 可辅助：/wp-json/bq/v1/data 返回 {"sites":171,"posts":...}
#      （171 含未公开站点，公开列表以 /favorites/allblog 的 124 为准）；
#      /wp-json/bokequan/v1/hot 返回热门博文（非友链列表）。
# 更新方式：重新抓取 /favorites/allblog 的 page/1..9 并提取 data-url 即可。
# ────────────────────────────────────────────────────────────

