# ── 数据源说明 ─────────────────────────────────────────────
# 站点：万界书简 (ruae.com) — 博客收录平台（洞府名录）
# 数据获取方式（2026-08-18 实测）：
#   1. 博客目录（洞府名录）在 https://ruae.com/blogs.php（重定向到 /blogs），
#      表格每行含 站名 + 域名 + 状态，并带「访问原站」外链 <a href="真实URL" title="访问原站">。
#   2. 分页参数：/blogs?sort=post_count&page=N（sort 可选 post_count/clicks/newest），
#      每页 25 条，共 88 行（含 2 条重复，实际 86 个唯一站点）。
#   3. 页面顶部「共收录 88 处洞府」与「共 88 条」可确认总数；状态含 正常/异常 等，
#      异常站点仍在名录中，一并收录。
#   4. 每个博客另有详情页 https://ruae.com/blog.php?id=<id>（含描述/订阅等，非必需）。
# 更新方式：抓取 /blogs?sort=post_count&page=1..4，提取「访问原站」外链即可。
# ────────────────────────────────────────────────────────────

