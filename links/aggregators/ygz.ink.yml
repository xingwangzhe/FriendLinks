# ── 数据源说明 ─────────────────────────────────────────────
# 站点：有个站 (www.ygz.ink) — 独立博客书架/博客聚合平台
# 数据获取方式（2026-08-18 实测）：
#   1. 官方 JSON API：https://www.ygz.ink/api/blogs.php 一次返回全部博客列表
#      （134 条），字段含 name / url / description / tags / category，无需鉴权。
#   2. 页面为纯前端渲染（首页 JS fetch('/api/blogs.php')），另有
#      api/blog_detail.php?url=<url>（详情）、api/online.php（在线状态）、
#      api/rss_aggregator.php（RSS 聚合）等辅助接口。
#   3. API 的 category 字段分三类：personal(90)/aggregator(40)/directory(4)，
#      本文件收录该平台书架全部 134 条（含其收录的其它聚合站/导航站）。
#   4. 注意：www.ygz.ink（有个站·博客聚合）与 ygz.ink（宗宗酱个人博客）是
#      两个不同站点；本 yml 收录的是前者，勿混淆。
# 更新方式：直接重新请求 api/blogs.php 即可刷新全部 134 个站点。
# ────────────────────────────────────────────────────────────

