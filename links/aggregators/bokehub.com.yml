# ── 数据源 ──────────────────────────────────────────────
# 博客中心 (bokehub.com) 是中文独立博客收录聚合平台，支持 RSS 订阅与博客发现。
# 说明：站点为 Vue SPA，数据来自后端 JSON API（从 main.js 反编译获得端点）：
#   GET https://bokehub.com/api/blogs?sort=name&keyword=&page=<N>
#   - 分页返回 { pageNo, pageSize, total, results }，pageSize 固定 10，共 103 条，11 页。
#   - 字段：name=博客名, domainName=域名, address=博客URL, rssAddress=订阅源,
#     description=博客描述, postCount/accessCount=文章/访问统计, valid=是否有效。
# 更新方式：循环抓取 page=1..11 直至 results 为空，按 domainName 去重后填充。
# 另可用 GET /api/popular-blogs 获取热门博客（仅 20 条），/api/monthly-selected?page= 获取月度精选。
# ──────────────────────────────────────────────────────

