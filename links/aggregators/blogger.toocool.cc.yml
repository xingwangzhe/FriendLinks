# ── 数据源（用于更新 friends）────────────────
# 站点: BOZHU 博主导航 https://blogger.toocool.cc/
# 类型: OneNav WordPress 主题；REST API 公开（/wp-json/wp/v2/sites，共 123 站）
# 地址: 完整列表用 admin-ajax 分页获取（无需登录）：
#       POST https://blogger.toocool.cc/wp-admin/admin-ajax.php
#       body: action=load_big_posts&id=iow_big_posts_max-2&style=sites-default&orderby=date&page=N （每页10，共13页）
#       卡片 .sites-item 中 a.sites-body[data-url] = 站点 URL；h3.item-title b = 名称
#       .text-muted.text-xs = 描述
# 注意: 首页"今天想读谁"是随机推荐(orderby=rand)，不是完整列表；最新 11 站需抓详情页
#       /url/<id>.html 中 .site-go a[title=进入主页] 取 URL（已关闭站点无跳转则跳过）
# 方法: curl 抓 13 页 admin-ajax → 正则提取；再补抓最新站详情页
# 抓取时间: 2026-08-18 | 条目: 122（站点共 123，其中 1 站已关闭仅存档）
# ─────────────────────────────────────────

