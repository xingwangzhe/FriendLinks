# ── 数据源 ──────────────────────────────────────────────
# 揪蝉 (hi.jiuchan.org) 是一个个人网站收录与随机访问平台。
# 数据来自其 Next.js 前端调用的后端 API（从 JS chunk 中反编译获得端点）：
#   GET https://api.jiuchan.org/website/open/list?page=<N>&size=10
#   - 公开站点列表接口，size 固定为 10，共 7 页，62 条。
#   - 返回字段：name=站点名, domain=域名, signature=站点描述,
#     feedURL=订阅源, totalVisits/dayVisits=访问统计,
#     platformName/categoryName=平台/分类。
# 更新方式：循环抓取 page=1..7 即可，若 totalPage 变化请调整页数。
# ──────────────────────────────────────────────────────

