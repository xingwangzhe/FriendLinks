# ── 数据源说明 ─────────────────────────────────────────────
# 站点：博客之家 (perass.com) — WordPress + onenav 主题的博客导航站
# 数据获取方式（2026-08-18 实测）：
#   1. 博客按 favorites 分类归档：https://www.perass.com/archives/favorites/<slug>
#      每页 50 条，超出分页 /page/2、/page/3 …；友链卡片 <a class="card" data-url="真实URL"
#      title="站名">，站名在 <strong>，描述在 <p class="overflowClip_1 …">。
#   2. 分类清单来自首页各栏目（程序员/技术分享/网络安全/运维/互联网/无线电/律师/医生/
#      旅游/文学/教育/经济/历史/国外见闻/生活），共 21 个分类 slug：
#      it-dev-all, it-front, it-dev-back, it-dev-phone, it-data, it-dev-iot,
#      developer-b, tech, anquan, it-run, www, wuxian, lvshi, yisheng, travel,
#      wenxue, edu, jingji, history, laowai, life；总计 796 个唯一站点。
#   3. 跳转链接 https://www.perass.com/go/?url=<base64> 的 url 参数 base64 解码即真实
#      站点 URL（与 data-url 一致，仅作 302 中转）。
#   4. 分类计数可用 WP REST：/wp-json/wp/v2/favorites?per_page=100（count 字段）。
# 更新方式：按上述 21 个分类 slug 重新抓取（含分页）提取 data-url 即可。
# ────────────────────────────────────────────────────────────

